services:
  neo4j:
    image: neo4j:latest
    container_name: neo4j
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  python:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neo4j_scripts
    depends_on:
      - neo4j
    environment:
      - NEO4J_URL=${NEO4J_URL}
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
    volumes:
      - ./scripts:/scripts  # your scripts are still mounted, so edits are instant
      - ./data/source:/scripts/data/source # output files appear locally here
    command: tail -f /dev/null

  webprotege-mongodb:
    image: mongo:4.4
    container_name: webprotege-mongodb
    restart: unless-stopped
    volumes:
      - webprotege_mongodb_data:/data/db

  webprotege:
    image: protegeproject/webprotege
    container_name: webprotege
    restart: unless-stopped
    depends_on:
      - webprotege-mongodb
    environment:
      - webprotege.mongodb.host=webprotege-mongodb
      - webprotege.mongodb.port=27017
    ports:
      - "5000:8080"
    volumes:
      - webprotege_data:/srv/webprotege


volumes:
  neo4j_data:
  webprotege_mongodb_data:
  webprotege_data: